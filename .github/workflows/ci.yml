name: TravelSetu checks
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
  native-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/gateway/package-lock.json
      - run: npm ci
        working-directory: services/gateway
      - run: npm run check
        working-directory: services/gateway
      - run: node services/compute/build.mjs
      - run: node --experimental-strip-types --test tests/native.test.mjs
      - run: node --experimental-strip-types tests/gateway-smoke.mjs
